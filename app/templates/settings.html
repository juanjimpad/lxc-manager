<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t.app_name }} · {{ t.settings_title }}</title>
<link rel="stylesheet" href="/static/pico.min.css">
<link rel="stylesheet" href="/static/custom.css?v={{ asset_v }}">
<script src="/static/htmx.min.js"></script>
</head>
<body>
<main class="container" style="max-width: 24rem;">
  <p><a href="/">{{ t.back }}</a></p>
  <hgroup>
    <h1>{{ t.settings_title }}</h1>
    <p>{{ t.session_label }}: {{ user }}</p>
  </hgroup>

  <h2>{{ t.change_password_title }}</h2>
  <form hx-post="/settings/password" hx-target="#pw-feedback" hx-swap="innerHTML">
    <label>{{ t.current_password }}
      <input type="password" name="current_password" required>
    </label>
    <label>{{ t.new_password }}
      <input type="password" name="new_password" required minlength="12">
    </label>
    <button type="submit" class="btn-md">{{ t.change_button }}</button>
  </form>
  <span id="pw-feedback"></span>

  <p><a href="/logout">{{ t.nav_logout }}</a></p>
</main>
</body>
</html>
