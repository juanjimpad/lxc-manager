<!doctype html>
<html lang="en" data-theme="light" data-app-version="{{ app_version }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t.app_name }} · {{ t.settings_title }}</title>
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png?v={{ asset_v }}">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v={{ asset_v }}">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v={{ asset_v }}">
<link rel="stylesheet" href="/static/pico.min.css">
<link rel="stylesheet" href="/static/custom.css?v={{ asset_v }}">
<script src="/static/htmx.min.js"></script>
<script src="/static/self-update.js?v={{ asset_v }}"></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
<main class="container">
  {% include "_nav.html" %}
  <hgroup>
    <h1>{{ t.settings_title }}</h1>
    <p>{{ t.session_label }}: {{ user }}</p>
  </hgroup>

  <h2>{{ t.settings_version }}</h2>
  {% include "_settings_version.html" %}
  <button
    type="button"
    class="btn-md"
    hx-post="/settings/check-update"
    hx-target="#settings-version"
    hx-swap="outerHTML"
    hx-disabled-elt="this">{{ t.check_updates }}</button>

  <h2>{{ t.change_password_title }}</h2>
  <form class="settings-form" hx-post="/settings/password" hx-target="#pw-feedback" hx-swap="innerHTML">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>{{ t.current_password }}
      <input type="password" name="current_password" required autocomplete="current-password" maxlength="256">
    </label>
    <label>{{ t.new_password }}
      <input type="password" name="new_password" required minlength="12" maxlength="256" autocomplete="new-password">
    </label>
    <button type="submit" class="btn-md">{{ t.change_button }}</button>
  </form>
  <span id="pw-feedback"></span>
</main>
{% include "_footer.html" %}
</body>
</html>
