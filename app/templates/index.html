<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t.app_name }}</title>
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png?v={{ asset_v }}">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v={{ asset_v }}">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v={{ asset_v }}">
<link rel="stylesheet" href="/static/pico.min.css">
<link rel="stylesheet" href="/static/custom.css?v={{ asset_v }}">
<script src="/static/htmx.min.js"></script>
</head>
<body>
<main class="container">
  <nav>
    <ul></ul>
    <ul><li><a href="/settings">{{ t.nav_settings }}</a></li><li><a href="/logout">{{ t.nav_logout }}</a></li></ul>
  </nav>
  <div class="section-header">
    <hgroup>
      <h1>{{ t.app_name }}</h1>
      <p>{{ t.index_subtitle }}</p>
    </hgroup>
    <button
      hx-post="/refresh"
      hx-target="#guest-table"
      hx-swap="outerHTML"
      hx-indicator="#refresh-indicator"
      hx-disabled-elt="this"
      class="btn-icon btn-icon-lg"
      title="{{ t.refresh }}"
      aria-label="{{ t.refresh }}">
      {{ t.icon_check }}
    </button>
  </div>
  <span id="refresh-indicator" class="htmx-indicator" style="font-size:0.8rem;">{{ t.refreshing }}</span>

  {% include "_guests_table.html" %}
</main>
</body>
</html>
