<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t.app_name }} · {{ t.login_title }}</title>
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png?v={{ asset_v }}">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v={{ asset_v }}">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v={{ asset_v }}">
<link rel="stylesheet" href="/static/pico.min.css">
<link rel="stylesheet" href="/static/custom.css?v={{ asset_v }}">
</head>
<body>
<main class="container" style="max-width: 24rem;">
  <hgroup>
    <h1>{{ t.app_name }}</h1>
    <p>{{ t.login_title }}</p>
  </hgroup>
  {% if error %}<p style="color: var(--status-failed)">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>{{ t.username }}
      <input type="text" name="username" autofocus required autocomplete="username">
    </label>
    <label>{{ t.password }}
      <input type="password" name="password" required autocomplete="current-password" maxlength="256">
    </label>
    <button type="submit">{{ t.login_button }}</button>
  </form>
</main>
</body>
</html>
